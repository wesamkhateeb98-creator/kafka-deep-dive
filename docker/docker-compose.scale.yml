# Scale-out lab — run ON TOP of docker-compose.yml (same project name):
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.scale.yml -p kafka-learn up -d kafka-4
#   docker compose -f docker/docker-compose.yml -f docker/docker-compose.scale.yml -p kafka-learn up -d --scale inventory=3 inventory
# See docs/09-scaling/

services:
  # ── 1) Scale the CLUSTER: a 4th broker (broker-only, joins the existing KRaft quorum) ──
  kafka-4:
    image: apache/kafka:4.1.0
    container_name: kafka-4
    restart: unless-stopped
    ports: ["29095:29095"]
    environment:
      CLUSTER_ID: "4L6g3nShT-eMCtK--X86sw"                  # MUST match the existing cluster
      KAFKA_NODE_ID: 4                                       # new unique id
      KAFKA_PROCESS_ROLES: "broker"                          # not a controller → quorum unchanged
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_LISTENERS: "INTERNAL://:19092,EXTERNAL://:29095"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka-4:19092,EXTERNAL://localhost:29095"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

  # ── 2) Scale the CONSUMERS: N replicas of the same group (no container_name, no host ports) ──
  inventory:
    build:
      context: ../examples/dotnet
      args: { PROJECT: 13-EventDriven }
    image: kafka-example-13
    command: ["inventory"]
    environment:
      KAFKA_BOOTSTRAP: "kafka-1:19092,kafka-2:19092,kafka-3:19092"
    restart: unless-stopped
    depends_on: [kafka-1, kafka-2, kafka-3]
