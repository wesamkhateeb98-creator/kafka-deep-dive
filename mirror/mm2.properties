# MirrorMaker 2: copy topics from the main cluster ("primary") to the DR cluster ("dr")
clusters = primary, dr
primary.bootstrap.servers = kafka-1:29092,kafka-2:29092,kafka-3:29092
dr.bootstrap.servers = kafka-dr:29092

primary->dr.enabled = true
primary->dr.topics = 32-.*
primary->dr.groups = 32-.*

# translate consumer offsets so a group can fail over to dr and resume
primary->dr.sync.group.offsets.enabled = true
primary->dr.emit.checkpoints.interval.seconds = 5
primary->dr.sync.group.offsets.interval.seconds = 5
refresh.topics.interval.seconds = 5
refresh.groups.interval.seconds = 5

# the dr cluster has one broker
replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1
offset.storage.replication.factor = 1
status.storage.replication.factor = 1
config.storage.replication.factor = 1
